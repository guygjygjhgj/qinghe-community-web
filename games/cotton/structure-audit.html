<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋棉 · 结构与连续动作核查</title><link rel="stylesheet" href="style.css"><style>
body{margin:0;padding:40px 24px 80px;background:#f5f2e9;color:#263e32;font:16px/1.8 system-ui,sans-serif}header,.report{max-width:1120px;margin:auto}header>a{font-size:14px;text-decoration:underline}h1{font-size:34px;line-height:1.4;margin:22px 0 16px}h2{font-size:24px;font-weight:550;margin:34px 0 14px}p{max-width:900px}small{display:block;color:#5f695c}.notice{border-left:4px solid #bd733f;background:#eee6d7;padding:16px 22px;margin:22px 0}.cases{display:flex;gap:8px;flex-wrap:wrap}.cases button{background:transparent;border:1px solid #a9b4a2;padding:9px 14px;border-radius:6px;color:#263e32}.cases button[aria-pressed=true]{background:#2d513c;color:#fff}.comparison{display:flex;gap:32px;justify-content:center;margin:24px 0;flex-wrap:wrap}.preview{margin:0}.preview>div{position:relative;width:300px;height:650px;overflow:hidden;background:#eee}.preview .scene{position:absolute;width:750px;height:1625px;transform:scale(.4);transform-origin:0 0;overflow:hidden}figcaption{max-width:300px;font-size:14px;line-height:1.65;margin:10px 0}.findings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.finding{padding:24px;border:1px solid #d4d9cb;background:#fffdf7;border-radius:8px}.finding h3{font-size:20px;line-height:1.5;margin:6px 0 12px}.finding p{margin:12px 0;font-size:15px}.tag{font-size:12px;color:#785c37}.status{font-size:13px;color:#926337}.verified{color:#2f7043}.scope{font-size:14px;color:#636f61}.step{padding:12px 0;border-top:1px solid #cfd6c5}a.inspect{display:inline-block;font-size:14px;text-decoration:underline;margin-top:8px}#explanation{min-height:80px}footer{margin-top:36px;font-size:14px;color:#63705e}@media(max-width:760px){body{padding:22px 16px 60px}h1{font-size:27px}.findings{grid-template-columns:1fr}.comparison{gap:12px}.preview>div{width:150px;height:325px}.preview .scene{transform:scale(.2)}figcaption{max-width:150px;font-size:12px}}
</style></head><body><header><a href="./">返回触控游戏</a><h1>先让物体与动作连得上</h1><p>秋棉游戏 · 结构、材料状态与手势连续性核查 · 2026.10.09</p><div class="notice"><strong>本轮已修：第一章裁切与图片比例、跨状态的遮罩匹配。</strong><br>布套结构、拉链连接、棉量变化、局部试压和换场仍需重做。下方明确列出证据与验收条件，不以“已有图片和视频”作为完成标准。</div><p id="scope" class="scope"></p></header><div class="report"><h2>查看具体问题</h2><div class="cases" id="cases"></div><p id="explanation"></p><div class="comparison"><figure class="preview"><div><div class="scene" id="before"></div></div><figcaption id="before-label"></figcaption></figure><figure class="preview"><div><div class="scene" id="after"></div></div><figcaption id="after-label"></figcaption></figure></div><small>预览使用现有图层实时合成。翻片与拉片中途图按当前交互中的实际位移规则复现；它们是问题示意，不是修复后的方案或浏览器截图。</small><h2>14 项核查结果</h2><div class="findings" id="findings"></div><h2>正确的修正顺序</h2><div id="sequence"></div><footer>优先完成同一布套的掀开—放棉—合拢—收口，再补其余动作。当前游戏进度未因本次检查而清空，Figma 原稿未修改。<br><a href="review.html">查看现有全部图稿</a></footer></div><script type="module">
import{renderScene,prepareScene}from'./renderer.js';import{renderScene as renderOld}from'./audit-renderer-before.js';
const [scenes,report]=await Promise.all([fetch('scenes.json').then(r=>r.json()),fetch('structure-findings.json').then(r=>r.json())]);const by=Object.fromEntries(scenes.map(s=>[s.id,s]));document.querySelector('#scope').textContent=report.scope;
const cases=[
{title:'第一章变形',a:'P02',b:'P02',old:true,left:'修复前：整屏图片被挤进窄条与照片框。',right:'本轮已修：按原裁切范围显示棉铃照片。',copy:'错误来自图片导入后的裁切解释。P01入口未复现同类压缩，严重变形出现在P02棉铃观察页；同类裁切显示也已覆盖P18。'},
{title:'布片脱离',a:'P08',b:'P08',mutate:s=>{s.nodes.find(n=>n.name.includes('翻盖')).m[5]-=160;},left:'现有开始状态：只有上沿条状布片。',right:'现有规则的上移160px：布片与布套分离。',copy:'独立拆分不等于可以彼此脱离。上盖必须拥有完整布面，并绕固定缝边翻折；当前素材没有足够的布面来完成这个动作。'},
{title:'拉链脱节',a:'P14',b:'P14',mutate:s=>{const n=s.nodes.find(n=>n.name.includes('拉片'));n.m[4]-=580;n.m[5]+=105;},left:'现有拉片起点。',right:'现有拖动终点：拉片移动，照片里的开缝仍保留。',copy:'仅平移拉片不能模拟收口。链轨、开口长度和拉片位置应共享同一进度，整个组件固定在布套边缘。'},
{title:'棉量不守恒',a:'P09',b:'R05',left:'分次填棉：托盘中是可分别取用的棉份。',right:'进入铺层：托盘却变成整堆棉。',copy:'下一张图重新指定了托盘内容，覆盖了刚才取走的数量。源处减少、目标处增加和撤回需要来自同一份材料数据。'},
{title:'布套前后结构',a:'P08',b:'P14',left:'打开时：整片内衬外露。',right:'合拢时：只有前边一道开口。',copy:'当前采用了两种不匹配的开口结构。建议统一为后边缝合、三边拉链的布套，以支持整面打开和铺棉；全程使用同一组连接边。'},
{title:'换场换了物体',a:'P14',b:'P15',left:'桌面：这一张坐垫的花纹、开口与外形。',right:'椅面：另一张素材的坐垫外形和接缝。',copy:'切换相机可以改变透视，但同一坐垫的花纹、缝线、厚度与开口仍应可追踪。移出屏幕再换图不应当作搬运完成。'}];
async function show(c){for(const b of document.querySelectorAll('.cases button'))b.setAttribute('aria-pressed',String(b.textContent===c.title));document.querySelector('#explanation').textContent=c.copy;const a=structuredClone(by[c.a]),b=structuredClone(by[c.b]);c.mutate?.(b);await Promise.all([prepareScene(a),prepareScene(b)]);(c.old?renderOld:renderScene)(document.querySelector('#before'),a);renderScene(document.querySelector('#after'),b);document.querySelector('#before-label').textContent=c.left;document.querySelector('#after-label').textContent=c.right;}
for(const c of cases){const b=document.createElement('button');b.textContent=c.title;b.onclick=()=>show(c);document.querySelector('#cases').append(b);}await show(cases[0]);
for(const f of report.findings){const el=document.createElement('article');el.className='finding';const tag=document.createElement('div');tag.className='tag';tag.textContent=f.id+' · 严重度 '+f.severity+'/4 · '+f.scene;const title=document.createElement('h3');title.textContent=f.title;const status=document.createElement('div');status.className='status'+(f.status.startsWith('本轮已')?' verified':'');status.textContent=f.status;el.append(tag,title,status);for(const [label,key]of[['证据','evidence'],['怎么修','fix'],['怎样验收','acceptance']]){const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label+'：';p.append(strong,document.createTextNode(f[key]));el.append(p);}const small=document.createElement('small');small.textContent='原则：'+f.principle;el.append(small);document.querySelector('#findings').append(el);}report.sequence.forEach((s,i)=>{const p=document.createElement('div');p.className='step';p.textContent=(i+1)+' / '+s;document.querySelector('#sequence').append(p);});
</script></body></html>
