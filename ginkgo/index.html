<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fdf9f1"><title>银杏留秋 · 把秋天装进小画框</title><link rel="stylesheet" href="game.css"></head><body><main id="shell"><div id="frame"><header><div class="topbar"><button id="back"><span class="back-icon">‹</span>返回</button><div class="top-actions"><button id="sound" aria-pressed="true">♫ 声音</button><button id="pause">休息</button></div></div><h1 id="title"></h1><p id="subtitle"></p></header><div id="scene" aria-label="银杏手工工作台"><div id="objects"></div></div><footer><p id="hint" aria-live="polite"></p><div id="tools" class="quiet-tools"><button id="undo"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M7 6v9h9M7 14C14 1 31 7 30 20c-1 11-14 15-22 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>撤回</button><span class="divider"></span><button id="help"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 12c0-6 11-6 11 0 0 4-6 4-6 8M17 25v1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>看看做法</button></div><div id="selection-tools" hidden><button id="rotateLeft">向左转</button><button id="rotateRight">向右转</button><button id="returnLeaf">放回竹盘</button></div><div id="intro-actions" hidden><button id="start">开始留住秋天</button></div><div id="result-actions" hidden><button id="save">收好这幅画</button><button id="recap">回看自己的摆法</button><button id="replay">再做一幅</button><button id="collection">我的作品</button></div></footer><dialog id="dialog"><div class="dialog-body"><h2 id="dialogTitle"></h2><div id="dialogContent"></div><button id="dialogClose">回到工作台</button><button id="exitPaused" hidden>保存并离开</button></div></dialog></div></main><script type="module" src="game.mjs"></script></body></html>
